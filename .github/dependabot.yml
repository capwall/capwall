# Dependabot, chosen over Renovate for one concrete reason: ci.yml's header already says every
# `uses:` is pinned to a commit SHA with a trailing `# vX.Y.Z` comment, "the form Dependabot writes
# and updates, if it is ever turned on here". This turns it on. Renovate would do the same job with
# more configuration and a third-party app installed on the repository, which is a strange thing to
# add to a supply-chain security tool to save reading a diff.
#
# `ci.yml` AND `commit-conventions.yml` NOW RUN ON THE PULL REQUESTS DEPENDABOT OPENS — the
# billing block (#3) is closed: the repo was transferred to `capwall/capwall` and made public,
# and public repos get unlimited standard-runner minutes. That does not retire the manual pass:
# CI does not run `pnpm ci:local` itself (see docs/ci-local.md for what the difference is), and it
# checks none of the three licence rules below, so every Dependabot PR still needs a human to run
# `ci:local` and read the diff before merging it. That is the reason for the low limits and the
# monthly cadence below: an unreviewable PR queue is worse than a slightly stale lockfile.
#
# THREE LICENCE RULES, NOT ONE, apply to anything Dependabot proposes — AGENTS.md § 5. In
# decreasing severity: non-compete / source-available is refused at any depth; runtime deps are
# MIT/BSD/Apache-2.0 only; weak copyleft is acceptable in devDependencies. Dependabot cannot check
# any of that. `pnpm --filter '@capwall/*' licenses list --prod` is the one-command check for the
# rule that matters most, and it should print exactly one package.

version: 2
updates:
  # The workflows that build, test and PUBLISH this repository. This is the ecosystem worth having
  # automated: a pinned SHA is only as good as the process that moves it, and hand-resolving one
  # (`gh api repos/<owner>/<repo>/git/ref/tags/<tag>`) is exactly the chore that gets skipped.
  # release.yml holds `id-token: write`, so a stale action there is code with an OIDC token in
  # reach.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      actions:
        patterns: ["*"]

  # devDependencies only — the four publishable packages' runtime closure is one package (`zod`),
  # and a runtime dependency bump is a decision with a paragraph in the PR description, not a
  # notification. Grouped and monthly because AGENTS.md § 5 is explicit that dependency currency
  # here is decided by MEASUREMENT (`pnpm bench:startup`, `pnpm ci:local` on 22/24/26), not by
  # reading release notes: #158 removed two version overrides that had aged into caps nobody
  # re-read, and #161 priced a single major (zod 3 → 4) at ~58 ms of startup. A weekly stream of
  # single-package PRs would produce the opposite of that discipline.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    versioning-strategy: increase
    labels: ["dependencies"]
    commit-message:
      prefix: "chore"
      include: scope
    allow:
      - dependency-type: development
    groups:
      dev-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # A MAJOR is deliberately left OUT of the group above, so each one arrives as its own PR with
    # its own measurement. One of them is not a decision at all, and is declined here.
    ignore:
      # `@types/node` MUST TRACK THE `engines` FLOOR, NOT THE NEWEST RUNTIME TESTED. The floor is
      # `>=22.15.0` (root package.json), so the types have to describe Node 22 — that is the whole
      # job they do here. Typing against 26 does not "add support" for anything: it makes `tsc`
      # accept calls to APIs that do not exist on the oldest runtime capwall claims to run on, and
      # the failure surfaces at a user's runtime rather than in this repository's build. `pnpm
      # ci:local` on 22/24/26 would not catch it either — it runs the code, and code that was
      # never written because the types forbade it is exactly what is missing.
      #
      # WHEN THIS MOVES: when the `engines` floor moves. Bump `@types/node`'s major to match the
      # new floor's major in the same PR that raises `engines`, and delete or re-target this rule
      # there — it is a statement about the floor, not a permanent pin. Only majors are ignored;
      # 22.x minors and patches still come through the group above, which is where real Node 22
      # typing fixes live.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
