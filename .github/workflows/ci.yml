name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # THE MATRIX IS THE SUPPORTED RANGE, AND `engines` MUST AGREE WITH IT (>=22.15.0 in all
        # four manifests). Node 20 went end-of-life on 2026-04-30 and was dropped here; 22 is the
        # floor because `module.registerHooks()` is 22.15 and capwall wants that API ungated
        # (issue #152). 24 is the active LTS. 26 is `current` and becomes LTS on 2026-10-28 — it
        # is carried now so a break lands as a CI failure while it is still cheap to fix, not on
        # the day it becomes the version everyone upgrades to.
        #
        # The floor leg is not the boring one: 22 is where a newer API used unconditionally
        # breaks, and 26 is where a removed one does. Do not narrow this to a single version.
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # oxlint over the whole repo (.oxlintrc.json) — a defect gate distinct from Typecheck,
      # not a second `tsc` pass. See docs/ci-local.md § the fast path.
      - name: Lint
        run: pnpm lint

      # The roadmap S4 perf claim, checked rather than assumed. Reduced-iteration run (~10s)
      # gating on a CO-SAMPLED RATIO, not on absolute microseconds — a shared runner's speed
      # cancels out, so this is not a flaky gate. scripts/bench/README.md § The regression gate
      # documents how the threshold was derived and what it will and will not catch.
      - name: Perf gate
        run: pnpm bench:gate
