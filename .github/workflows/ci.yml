name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # oxlint over the whole repo (.oxlintrc.json) — a defect gate distinct from Typecheck,
      # not a second `tsc` pass. See docs/ci-local.md § the fast path.
      - name: Lint
        run: pnpm lint

      # The roadmap S4 perf claim, checked rather than assumed. Reduced-iteration run (~10s)
      # gating on a CO-SAMPLED RATIO, not on absolute microseconds — a shared runner's speed
      # cancels out, so this is not a flaky gate. scripts/bench/README.md § The regression gate
      # documents how the threshold was derived and what it will and will not catch.
      - name: Perf gate
        run: pnpm bench:gate
