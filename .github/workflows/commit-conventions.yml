# Conventional-commit enforcement. THIS IS A RELEASE GATE, NOT A STYLE GATE.
#
# release-please reads `main`'s commit messages to decide the next version and to write every line
# of CHANGELOG.md. A message that does not parse is not "untidy" — it is a change that silently
# does not appear in the release notes, and, if it was the only change, a release that is never
# proposed at all. `scripts/check-commit-messages.mjs` carries the rules and the reasoning.
#
# TWO JOBS, BECAUSE TWO DIFFERENT STRINGS CAN BE WRONG:
#
#  * `pr-title` — this repository squash-merges, so THE PR TITLE IS THE COMMIT MESSAGE that
#    reaches `main`. It is the one release-please will actually read, and it is not checked by
#    anything that looks at commits. `types: [edited]` matters: a title fixed after the first run
#    has to be re-checked, and a title *broken* after a green run has to go red again.
#  * `commits` — the individual commits on the branch. Belt and braces if the merge strategy ever
#    changes, and it is where a contributor finds out before the PR exists.
#
# BOTH JOBS RUN THE SAME SCRIPT, so there is exactly one implementation of the rules and no way for
# the two checks to disagree. A third-party PR-title action (the obvious one is
# amannn/action-semantic-pull-request) would be a second implementation AND a new third-party
# action in the CI of a supply-chain-security tool; piping the title into the repository's own
# validator costs one line and has neither problem.
#
# THE VALIDATOR HAS NO DEPENDENCIES, so neither job installs anything — no pnpm, no
# `pnpm install`, no lockfile, no store cache. It is `node` and one script. That is not an
# incidental saving: commitlint cost 68 packages of a 253-package dev tree to check that a string
# starts with a known word, in the CI of a tool whose whole argument is that a dependency tree is
# a liability you cannot see. The script's header says what was, and was not, the reason.
#
# `commits` VALIDATES THE PULL REQUEST'S RANGE, NEVER THE WHOLE HISTORY. Six commits already on
# `main` do not parse (`node scripts/check-commit-messages.mjs --all` names them). A job that
# walked everything reachable from HEAD would fail every pull request on commits its author did
# not write and cannot fix without rewriting published history, and a gate that is always red is a
# gate that gets switched off.
#
# THE TITLE GOES THROUGH `env:`, NEVER INTO THE `run:` STRING. `${{ github.event.pull_request.title }}`
# interpolated directly into a shell script is script injection from anyone who can open a PR.
# `--stdin` then reads it as data, so a title containing quotes, backticks or `$(…)` is a title
# rather than a command.
#
# EVERY `uses:` IS PINNED TO A COMMIT SHA (issue #168) — see ci.yml's header for how to resolve and
# round-trip a pin. UNVERIFIED: Actions is billing-blocked (#3), so this has never run in Actions.
# `pnpm lint:commits` runs the same script locally.

name: Commit conventions

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      # No `fetch-depth`: this job reads one string out of the event payload and the type list out
      # of `release-please-config.json`. It never looks at a commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `cache: pnpm`, and no pnpm: nothing is installed, so there is nothing to cache.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Check the pull-request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | node scripts/check-commit-messages.mjs --stdin

  commits:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — the check walks base..head, and a shallow clone has no base to walk to.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Check the commits on this branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-commit-messages.mjs --from "$BASE_SHA" --to "$HEAD_SHA"
